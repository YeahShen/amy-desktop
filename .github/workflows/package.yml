name: Build Electron App (Windows)

on:
  push:
    branches:
      - main # 当推送到 main 分支时触发
  workflow_dispatch: # 支持在 GitHub 页面手动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # 开启 npm 缓存，加快后续构建速度（如果用 yarn/pnpm 请修改）

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 执行 Electron Forge 打包
      - name: Make Electron Forge App
        run: npm run package

      # 5. 上传生成的安装包/产物到 GitHub Artifacts
      # - name: Upload Artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: windows-build
      #     # Electron Forge 默认生成产物的路径
      #     path: out/make/**/*
